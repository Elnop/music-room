name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-slim # 1 vCPU container runner, no Docker; 15 min cap
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run lint

  type-check:
    name: type-check
    runs-on: ubuntu-slim # 1 vCPU container runner, no Docker; 15 min cap
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm run type-check

  test:
    name: test
    runs-on: ubuntu-slim # 1 vCPU container runner, no Docker; 15 min cap
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [backend, mobile]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test

  test-int:
    name: test-int
    runs-on: ubuntu-24.04 # full VM: the local Supabase stack needs Docker
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The stack's images, cached between runs: anonymous pulls from ECR Public
      # run out of its data quota on shared runners (#327). The key follows the
      # Supabase CLI version, the Postgres version and the Redis image.
      - id: images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/docker-images
          key: test-int-images-${{ hashFiles('backend/package-lock.json', 'backend/supabase/config.toml', 'backend/scripts/test-db.sh') }}
          # An older set still spares the pulls of the images that did not change.
          restore-keys: test-int-images-
      - if: steps.images.outputs.cache-matched-key != ''
        run: zstd -dc ~/docker-images/images.tar.zst | docker load -q
      # Local Supabase stack (Docker) with backend/migrations applied, plus a Redis
      # container on a free port (session revocation); see doc/TESTING.md.
      - run: sh scripts/test-db.sh up
      - if: steps.images.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/docker-images
          docker ps -a --format '{{.Image}}' | sort -u | xargs docker save | zstd -T0 -q -o ~/docker-images/images.tar.zst
      - if: steps.images.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/docker-images
          key: ${{ steps.images.outputs.cache-primary-key }}
      - run: npm run test:int
      - if: always()
        run: sh scripts/test-db.sh down
