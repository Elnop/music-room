name: Release APK

# Builds the release APK pointed at the production backend. A push to main
# publishes it as a GitHub Release (releases/latest); a manual run on any other
# branch only uploads it as a workflow artifact.

on:
  push:
    branches: [main, 264-apk-github-release] # TEMP: test run, removed before review
  workflow_dispatch:

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # gh release create

jobs:
  apk:
    name: apk
    runs-on: ubuntu-latest # Android SDK preinstalled
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: https://zumik.cluzhub.com
      EXPO_PUBLIC_WS_URL: wss://zumik.cluzhub.com
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_FACEBOOK_APP_ID: ${{ secrets.EXPO_PUBLIC_FACEBOOK_APP_ID }}
      EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN: ${{ secrets.EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Check secrets
        run: |
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_ANON_KEY \
            EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID EXPO_PUBLIC_FACEBOOK_APP_ID EXPO_PUBLIC_FACEBOOK_CLIENT_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name"; missing=1; fi
          done
          exit "${missing:-0}"

      - run: npm ci
      - run: npx expo prebuild --clean --platform android
      # Release is signed with signingConfigs.debug: keystores/debug.keystore
      # (plugins/withDebugKeystore.js), whose SHA-1 is registered with Google.
      - run: ./gradlew assembleRelease --no-daemon --console=plain
        working-directory: mobile/android

      - name: Name the build
        id: name
        run: |
          version=$(node -p "require('./app.config.js').expo.version")
          tag="v${version}-build.${GITHUB_RUN_NUMBER}"
          # A re-run keeps the run number: give it its own tag
          if [ "$GITHUB_RUN_ATTEMPT" -gt 1 ]; then tag="$tag.$GITHUB_RUN_ATTEMPT"; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mv android/app/build/outputs/apk/release/app-release.apk "zumik-$tag.apk"

      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          VERSION: ${{ steps.name.outputs.version }}
        run: |
          gh release create "$TAG" "zumik-$TAG.apk" \
            --target "$GITHUB_SHA" \
            --title "Zumik $VERSION (build $GITHUB_RUN_NUMBER)" \
            --generate-notes \
            --latest

      - name: Upload the APK
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zumik-${{ steps.name.outputs.tag }}
          path: mobile/zumik-${{ steps.name.outputs.tag }}.apk
          retention-days: 7
