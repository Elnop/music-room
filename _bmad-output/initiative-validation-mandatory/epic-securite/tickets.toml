# epic-securite
# Ordre des tables = ordre de build. `area` = label GitHub area: <valeur>.

[[entry]]
id = 1
type = "story"
title = "Authentifier la connexion Socket.io par JWT (backend)"
description = "Définit le contrat de poignée de main (handshake.auth : token, deviceId, deviceName, platform, appVersion) documenté dans realtime, vérifie le token avec verifyToken (session.service.ts) dans un middleware io.use, place l'identité et l'appareil dans socket.data et supprime l'event auth:register. Le socket hérite ainsi de la révocation ajoutée par 3.1."
verify = "Tests : connexion sans token, avec token invalide ou expiré refusée ; l'identité de socket.data est celle du token ; auth:register n'est plus écouté."
covers = ["CAP-1", "CAP-3"]
after = ["1.7"]
hitl = false
risk = "high"
area = "backend"

[[entry]]
id = 2
type = "story"
title = "Envoyer le token et l'appareil à la connexion socket (mobile)"
description = "socketStore envoie la poignée de main du contrat de 1, se reconnecte avec le token rafraîchi et gère le refus ; useMusicControl n'émet plus auth:register."
verify = "Tests de socketStore : handshake avec token et champs d'appareil ; une erreur d'auth déclenche reconnexion ou déconnexion ; plus aucun emit auth:register."
covers = ["CAP-1", "CAP-3"]
after = [1, "1.8"]
hitl = false
risk = "medium"
area = "mobile"

