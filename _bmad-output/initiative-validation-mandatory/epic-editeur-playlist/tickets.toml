[[entry]]
id = 6
type = "story"
title = "Gérer les conflits et converger côté mobile"
description = "playlistStore envoie un move avec afterRank et la version affichée, un seul à la fois en reprenant la version de la réponse précédente ; sur 409 recharge et prévient l'utilisateur ; applique playlist:updated de version +1, ignore les versions déjà vues, recharge s'il en manque une ; ses tests couvrent tout le store (chargement, CRUD, collaborateurs, conflits). L'écran de détail d'une playlist offre des boutons monter et descendre sur chaque track pour l'éditeur, qui envoient un move."
verify = "Tests de playlistStore : deux moves rapides partent l'un après l'autre avec la version renvoyée ; 409 déclenche rechargement et message ; playlist:updated remplace l'ordre local, une version manquante déclenche un rechargement ; CRUD et collaborateurs couverts ; à la main, monter une track sur un appareil la fait bouger sur un second, et deux moves simultanés de la même track laissent les deux écrans dans le même ordre avec un message pour le perdant."
covers = ["CAP-5", "CAP-3"]
after = [2, "1.8", "6.3"]
hitl = false
risk = "medium"
area = "mobile"

