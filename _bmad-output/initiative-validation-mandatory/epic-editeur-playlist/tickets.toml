[[entry]]
id = 1
type = "spike"
title = "Choisir la stratégie de concurrence des tracks"
description = "Retient la stratégie de concurrence des tracks qui satisfait CAP-5 avec Supabase et la documente dans doc/PLAYLIST_CONCURRENCY.md : rangs fractionnaires, fonctions Postgres sous verrou de playlist, version par playlist et par track, 409 seulement sur la même track."
verify = "Une ligne Decision dans l'epic nomme la stratégie, le format de version et le comportement en conflit, et doc/PLAYLIST_CONCURRENCY.md la décrit."
covers = ["CAP-5"]
after = []
hitl = true
risk = "high"
area = "backend"

[[entry]]
id = 2
type = "story"
title = "Contrat d'API d'édition concurrente"
description = "Définit dans playlist.openapi.ts, selon doc/PLAYLIST_CONCURRENCY.md : add, remove et move ({ trackId, afterRank, expectedVersion }, qui remplace reorder), la version tracks_version dans chaque réponse et dans le fetch de playlist, les erreurs 409 TRACK_DUPLICATE, TRACK_NOT_IN_PLAYLIST, TRACK_MOVED_CONCURRENTLY et 404 TRACK_NOT_IN_PLAYLIST, le rank de chaque track et le payload playlist:updated (version et ordre) ; les types dans playlist.types.ts et mobile/src/types/playlist.types.ts."
verify = "Les endpoints et le payload apparaissent dans Swagger et dans les deux fichiers de types."
covers = ["CAP-5"]
after = [1]
hitl = false
risk = "medium"
area = "backend"

[[entry]]
id = 3
type = "story"
title = "Opérations atomiques sur les tracks (migration)"
description = "Ajoute la migration 016 (après la 015 de 4.1) selon doc/PLAYLIST_CONCURRENCY.md : playlist_tracks.rank (texte COLLATE "C", unique par playlist) à la place de position, moved_at_version, playlists.tracks_version, la fonction rank_between écrite dans le projet, et les fonctions add, remove et move qui verrouillent la playlist (FOR UPDATE) et rééquilibrent les rangs au-delà d'un seuil de longueur à fixer ; régénère les types."
verify = "Migration appliquée ; tests d'intégration sur le Postgres de 1.10 : moves concurrents de tracks différentes tous appliqués, moves concurrents de la même track dont un seul passe, rangs uniques, added_by inchangé, rééquilibrage après une longue série de moves dans le même intervalle."
covers = ["CAP-5", "CAP-3"]
after = [1, "4.1", "1.10"]
hitl = true
risk = "high"
area = "backend"

