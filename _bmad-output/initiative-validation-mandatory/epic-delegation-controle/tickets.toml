title = "Schéma des appareils et des licences par appareil (migration)"
description = "Ajoute la migration 015 (la 016 est réservée à epic-editeur-playlist) : appareils d'un utilisateur (deviceId persisté par l'app, nom, plateforme, dernière vue) et licences (appareil du propriétaire, ami autorisé), avec RLS ; follows.can_control_music reste et signifie « tous mes appareils » ; régénère supabase.generated.ts."
verify = "Migration appliquée dans Supabase, types régénérés, `npm run type-check` passe."
