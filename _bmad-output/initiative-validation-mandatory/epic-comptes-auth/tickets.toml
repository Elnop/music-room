# epic-comptes-auth
# Ordre des tables = ordre de build. `area` = label GitHub area: <valeur>.

[[entry]]
id = 1
type = "story"
title = "Révoquer la session au logout (backend)"
description = "POST /api/auth/logout ajoute le token à une denylist Redis jusqu'à son expiration et révoque le refresh token (signOut admin Supabase) ; verifyToken (session.service.ts) refuse les tokens de la denylist ; la doc logout de auth.openapi.ts est mise à jour."
verify = "Tests : après logout, l'ancien token reçoit 401 et /refresh avec l'ancien refresh token échoue."
covers = ["CAP-9", "CAP-3"]
after = ["1.7"]
hitl = false
risk = "medium"
area = "backend"

[[entry]]
id = 2
type = "story"
title = "Couper le socket au logout (mobile)"
description = "authStore.logout, qui appelle déjà l'API, coupe aussi la connexion socket et nettoie l'état même si l'API échoue."
verify = "Test de authStore : logout appelle l'API, déconnecte le socket et vide tokens et état."
covers = ["CAP-9", "CAP-3"]
after = [1, "1.8"]
hitl = false
risk = "low"
area = "mobile"

[[entry]]
id = 3
type = "story"
title = "Vérifier qu'un token révoqué est refusé par le socket (backend)"
description = "Test d'intégration : la poignée de main socket de 2.1 refuse un token révoqué par 1."
verify = "Le test de connexion socket avec un token révoqué échoue avec une erreur d'authentification."
covers = ["CAP-9", "CAP-3"]
after = [1, "2.1"]
hitl = false
risk = "low"
area = "backend"

[[entry]]
id = 4
type = "story"
title = "Contrat d'API de liaison de compte social"
description = "Définit dans auth.openapi.ts POST /api/auth/providers/{provider}/link (token du réseau en entrée, fournisseurs liés en sortie, erreurs déjà lié à un autre compte et token invalide), que 5 implémente et 6 consomme."
verify = "L'endpoint apparaît dans Swagger avec ses schémas d'entrée, de sortie et d'erreur."
covers = ["CAP-6"]
after = [1]
hitl = false
risk = "low"
area = "backend"

[[entry]]
id = 5
type = "story"
title = "Lier Google ou Facebook à un compte connecté (backend)"
description = "Implémente le contrat de 4 : vérifie le token, enregistre google_id ou facebook_id sur l'utilisateur connecté quel que soit l'email, refuse un id déjà lié ; corrige la connexion OAuth (user.service.ts) pour ouvrir la session du compte trouvé par l'id du réseau et non par l'email du réseau."
verify = "Tests : liaison d'un Google à email différent puis login Google sur le même compte ; liaison d'un id déjà pris refusée."
covers = ["CAP-6", "CAP-3"]
after = [4]
hitl = false
risk = "high"
area = "backend"

