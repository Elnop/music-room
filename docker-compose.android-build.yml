# Docker Compose for Android APK Build (Containerized)
# Uses hmerritt/android-sdk image with Android SDK pre-installed
# This approach eliminates local Android SDK requirements

services:
  android-builder:
    image: hmerritt/android-sdk:latest
    container_name: zumik-android-builder
    network_mode: "host"
    working_dir: /project/app/mobile
    volumes:
      # Mount entire project to access mobile directory
      - ./:/project/app
      # Cache Gradle dependencies to speed up subsequent builds
      - gradle-cache:/root/.gradle
      # Cache npm packages
      - mobile-node-modules:/project/app/mobile/node_modules
    environment:
      - NODE_ENV=production
      - ANDROID_SDK_ROOT=/android-sdk
      - EAS_NO_VCS=1
    command: /bin/bash -c "tail -f /dev/null"
    restart: "no"

volumes:
  gradle-cache:
    name: zumik-gradle-cache
  mobile-node-modules:
    name: zumik-mobile-node-modules
