<!doctype html>
<!--
	Template of the web export's index.html (Expo's own, plus the <noscript> parts). The page is the
	home of https://elnop.github.io/music-room/: robots that do not run JavaScript, such as Google's
	OAuth verification, read the description of the app and the link to the privacy policy below.
-->
<html lang="%LANG_ISO_CODE%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
		<meta
			name="description"
			content="Zumik: build playlists together and share control of the music with your friends."
		/>
		<title>%WEB_TITLE%</title>
		<!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
		<style id="expo-reset">
			/* These styles make the body full-height */
			html,
			body {
				height: 100%;
			}
			/* These styles disable body scrolling if you are using <ScrollView> */
			body {
				overflow: hidden;
			}
			/* These styles make the root element full-height */
			#root {
				display: flex;
				height: 100%;
				flex: 1;
			}
		</style>
		<!-- site/style.css, published next to the app -->
		<noscript>
			<link rel="stylesheet" href="style.css" />
			<style>
				body {
					overflow: auto;
				}
			</style>
		</noscript>
	</head>

	<body>
		<noscript>
			<main>
				<header>
					<img src="logo.png" alt="Zumik logo" />
					<h1>Zumik</h1>
				</header>

				<p>
					Zumik is a collaborative music app for Android, iOS and the web. Build playlists together in
					real time and share control of the music playing on your devices with your friends.
				</p>

				<h2>Features</h2>
				<ul>
					<li>
						<strong>Playlist Editor</strong>: edit a playlist with other people, every change shows up
						live for everyone.
					</li>
					<li>
						<strong>Music Control Delegation</strong>: let a friend control the music playing on your
						device.
					</li>
					<li>
						<strong>Friends and profiles</strong>: follow friends and choose what each of them can see
						on your profile.
					</li>
					<li>
						<strong>Sign-in</strong>: with an email address, a Google account or a Facebook account.
					</li>
				</ul>

				<h2>Download</h2>
				<p>
					The Android app is available from the
					<a href="https://github.com/Elnop/music-room/releases/latest">latest release</a>. This
					page runs the app in the browser once JavaScript is enabled.
				</p>

				<footer>
					<a href="privacy.html">Privacy policy</a> ·
					<a href="https://github.com/Elnop/music-room">Source code</a>
				</footer>
			</main>
		</noscript>
		<!-- The root element for your Expo app. -->
		<div id="root"></div>
	</body>
</html>
