# Pattern rules shared by backend/ and mobile/, run by `npm run check` through
# the pinned semgrep Docker image (tools/guardrails/docker-scan.mjs). Paths are
# relative to the repository root. Each message points to the rule's section
# in .agents/rules/guardrails.md. Rules are append-only: never weaken one, and
# only remove entries from an `exclude` list.
rules:
  - id: no-eval
    languages: [typescript]
    severity: ERROR
    message: >-
      eval() and new Function() run arbitrary code. See
      .agents/rules/guardrails.md#no-eval
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    paths:
      include:
        - /backend/src/
        - /mobile/src/
        - /mobile/App.tsx

  - id: no-asyncstorage-outside-storage
    languages: [typescript]
    severity: ERROR
    message: >-
      AsyncStorage is used only in storage modules; go through one of them.
      See .agents/rules/guardrails.md#no-asyncstorage-outside-storage
    pattern-either:
      - pattern: import $X from '@react-native-async-storage/async-storage'
      - pattern: import { $...X } from '@react-native-async-storage/async-storage'
    # Part of the rule's definition, not an exception: a storage module is
    # named <thing>Storage.ts, and AsyncStorage belongs there. Semgrep reads
    # only `paths`, so each `allowed-paths` glob is repeated in `exclude`;
    # check-exceptions.mjs does not count an exclude entry declared here, and
    # only for a suffix glob `*<Suffix>.<ext>` (Suffix a capitalised word of
    # 4+ letters). A new allowed-paths entry fails unless it is recorded for
    # this rule under `allowedPaths` in tools/guardrails/new-rule-baselines.json;
    # it changes the rule and takes a dedicated ticket
    # (guardrails.md#append-only-rules).
    metadata:
      allowed-paths:
        - "*Storage.ts"
    paths:
      include:
        - /mobile/src/
        - /mobile/App.tsx
      exclude:
        - "*Storage.ts"
        - "*.test.ts"
        - "*.test.tsx"
