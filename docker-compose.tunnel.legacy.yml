# Docker Compose Tunnel Override for Legacy Mode (Docker API 1.42)
# Usage: docker-compose -f docker-compose.legacy.yml -f docker-compose.tunnel.legacy.yml up
#
# This is the tunnel configuration compatible with Docker API 1.42
# (removes mobile service that's not in legacy base)

services:
  # Backend with ngrok tunnel
  backend:
    command: sh start-with-tunnel.sh
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TUNNEL_MODE=true
      - REDIS_HOST=redis
    ports:
      - "3000:3000"
      - "4040:4040"  # ngrok web interface
    volumes:
      # Share tunnel URL with build process
      - tunnel-info:/tmp/shared
      # Keep existing volumes from base compose
      - ./backend:/app
      - /app/node_modules
