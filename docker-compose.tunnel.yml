# Docker Compose override for Tunnel Mode
# Usage: docker-compose -f docker-compose.yml -f docker-compose.tunnel.yml up
#
# This configuration enables cross-network development where your phone
# and computer are on different networks (e.g., phone on cellular, PC on WiFi)

services:
  # Backend with ngrok tunnel
  backend:
    command: sh start-with-tunnel.sh
    environment:
      - NODE_ENV=development
      - PORT=3000
      - TUNNEL_MODE=true
    ports:
      - "3000:3000"
      - "4040:4040"  # ngrok web interface
    volumes:
      # Share tunnel URL with mobile container
      - tunnel-data:/tmp
      # Keep existing volumes
      - ./backend:/app
      - /app/node_modules

  # Mobile with Expo tunnel
  mobile:
    command: sh start-expo-tunnel.sh
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # In tunnel mode, don't need REACT_NATIVE_PACKAGER_HOSTNAME
      # Expo tunnel handles this automatically
      - TUNNEL_MODE=true
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    volumes:
      # Access to backend tunnel URL
      - tunnel-data:/tmp
      # Keep existing volumes
      - ./mobile:/app
      - /app/node_modules
      - /app/.expo
    depends_on:
      - backend

volumes:
  # Shared volume for tunnel URL communication
  tunnel-data:
    driver: local
